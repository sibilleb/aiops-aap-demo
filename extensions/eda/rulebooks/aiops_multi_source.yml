---
################################################################################
# AIOps Multi-Source Event-Driven Automation Rulebook
#
# Handles multiple types of alerts:
# 1. OpenShift Alert Correlation - Correlated alerts from OpenShift/Kubernetes
# 2. Linux Server Log Alerts - Log analysis requests from Linux servers
#
# Webhook Endpoint: /endpoint (listens on port 5000)
################################################################################

- name: AIOps Multi-Source Event Processing
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    # ========================================================================
    # RULE 1: OpenShift Alert Correlation (EXISTING USE CASE)
    # ========================================================================
    - name: Correlate OpenShift alerts and create incident
      condition: event.payload.correlated_alerts is defined or event.correlated_alerts is defined
      action:
        run_workflow_template:
          name: "AIOps: EDA Alert Correlation Workflow"
          organization: "AIOps Demos"
          job_args:
            extra_vars:
              correlated_alerts: "{{ event.payload.correlated_alerts | default(event.correlated_alerts) }}"
      enabled: true

    # ========================================================================
    # RULE 2: Linux Server Log Analysis (NEW USE CASE)
    # ========================================================================
    - name: Process Linux log alert and analyze
      condition: event.payload.log_alert is defined or event.log_alert is defined
      action:
        run_workflow_template:
          name: "AIOps: Linux Log Analysis Workflow"
          organization: "AIOps Demos"
          job_args:
            extra_vars:
              target_host: "{{ (event.payload.log_alert | default(event.log_alert)).hostname }}"
              log_file_path: "{{ (event.payload.log_alert | default(event.log_alert)).log_path }}"
              log_hours_back: "{{ (event.payload.log_alert | default(event.log_alert)).hours_back | default(1) }}"
              alert_severity: "{{ (event.payload.log_alert | default(event.log_alert)).severity }}"
              alert_source: "{{ (event.payload.log_alert | default(event.log_alert)).source | default('application') }}"
      enabled: true
